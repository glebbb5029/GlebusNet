<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GlebusNet Explorer</title>

    <!-- Иконка вкладки -->
    <link
        rel="icon"
        type="image/png"
        href="https://i.ibb.co/7d0fTvgN/file-000000004fc482109e9ebee3afecb3fb.png"
    >

    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            background-image: url("https://i.ibb.co/9kWk5CTW/Chat-GPT-Image-25-2026-17-33-25.png");
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 0;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .status {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 20px;
            background: #14532d;
            color: #86efac;
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            background: rgba(30, 41, 59, 0.92);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .label {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .value {
            font-size: 22px;
            font-weight: bold;
            word-break: break-all;
        }

        .section {
            margin-top: 30px;
        }

        .section h2 {
            margin-bottom: 15px;
        }

        .block {
            background: rgba(30, 41, 59, 0.92);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            backdrop-filter: blur(4px);
        }

        .block-number {
            font-size: 18px;
            font-weight: bold;
        }

        .small {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 6px;
            word-break: break-all;
        }

        .transaction {
            background: rgba(15, 23, 42, 0.94);
            border-radius: 10px;
            padding: 12px;
            margin-top: 12px;
            border-left: 4px solid #6366f1;
        }

        .transaction-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .token-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            vertical-align: middle;
            margin-right: 7px;
        }

        .amount {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .gas {
            color: #2169c0;
        }

        .glb {
            color: #60a5fa;
        }

        .error {
            background: #450a0a;
            color: #fca5a5;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
        }

        button {
            margin-top: 20px;
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>GlebusNet Explorer</h1>

    <div class="subtitle">
        Blockchain explorer for GlebusNet
    </div>

    <div id="status" class="status">
        Подключение...
    </div>

    <div class="cards">

        <div class="card">
            <div class="label">Сеть</div>
            <div class="value" id="network">—</div>
        </div>

        <div class="card">
            <div class="label">Chain ID</div>
            <div class="value" id="chainId">—</div>
        </div>

        <div class="card">
            <div class="label">Последний блок</div>
            <div class="value" id="blockNumber">—</div>
        </div>

        <div class="card">
            <div class="label">Токен</div>
            <div class="value">GLB</div>
        </div>

    </div>


    <div class="section">

        <h2>Информация о GLB</h2>

        <div class="card">

            <div class="label">
                Контракт
            </div>

            <div class="small">
                0x5FbDB2315678afecb367f032d93F642f64180aa3
            </div>

            <br>

            <div class="label">
                Название
            </div>

            <div class="value">
                Glebus
            </div>

            <br>

            <div class="label">
                Символ
            </div>

            <div class="value">
                GLB
            </div>

            <br>

            <div class="label">
                Общая эмиссия
            </div>

            <div class="value">
                1,000,000 GLB
            </div>

        </div>

    </div>


    <div class="section">

        <h2>Последние блоки</h2>

        <div id="blocks">
            Загрузка...
        </div>

        <button onclick="loadExplorer()">
            ↻ Обновить
        </button>

    </div>


    <div id="error"></div>

</div>


<script>

const API =
    "https://glebusnet.onrender.com/api/explorer";

const GLB_CONTRACT =
    "0x5FbDB2315678afecb367f032d93F642f64180aa3";

const TRANSFER_SELECTOR =
    "0xa9059cbb";


/*
    Сокращаем длинный адрес
*/
function shortAddress(address) {

    if (!address) {
        return "—";
    }

    return (
        address.slice(0, 6) +
        "..." +
        address.slice(-4)
    );
}


/*
    Форматируем число GLB.

    Neon возвращает value как строку.
    Поэтому здесь НЕ используем hexToBigInt.
*/
function formatGLB(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "0 GLB";
    }

    const amount = BigInt(value);

    const whole =
        amount / 1000000000000000000n;

    const fraction =
        amount % 1000000000000000000n;

    if (fraction === 0n) {

        return (
            whole.toLocaleString("en-US") +
            " GLB"
        );

    }

    const fractionString =
        fraction
            .toString()
            .padStart(18, "0")
            .replace(/0+$/, "");

    return (
        whole.toLocaleString("en-US") +
        "." +
        fractionString +
        " GLB"
    );
}


/*
    Форматируем GAS.

    Neon также хранит value как строку.
*/
function formatGas(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "0 GAS";
    }

    const wei = BigInt(value);

    const whole =
        wei / 1000000000000000000n;

    const fraction =
        wei % 1000000000000000000n;

    if (fraction === 0n) {
        return whole.toString() + " GAS";
    }

    const fractionString =
        fraction
            .toString()
            .padStart(18, "0")
            .replace(/0+$/, "");

    return (
        whole.toString() +
        "." +
        fractionString +
        " GAS"
    );
}


/*
    Создаём HTML одной транзакции
*/
function renderTransaction(transaction) {

    /*
        GLB перевод.
        Сервер уже декодировал ERC-20 transfer
        и передал готовые данные.
    */
    if (
        transaction.isTokenTransfer &&
        transaction.tokenAmount !== undefined &&
        transaction.tokenAmount !== null
    ) {

        return `

            <div class="transaction">

                <div class="transaction-title">

                    <img
                        src="https://i.ibb.co/7d0fTvgN/file-000000004fc482109e9ebee3afecb3fb.png"
                        class="token-icon"
                        alt="GLB"
                    >

                    GLB перевод

                </div>

                <div class="amount glb">
                    ${formatGLB(transaction.tokenAmount)}
                </div>

                <div class="small">
                    From:
                    ${shortAddress(transaction.from)}
                </div>

                <div class="small">
                    To:
                    ${shortAddress(transaction.tokenRecipient)}
                </div>

                <div class="small">
                    Tx:
                    ${transaction.hash}
                </div>

            </div>

        `;
    }


    /*
        Обычный GAS перевод
    */
    if (
        transaction.value &&
        BigInt(transaction.value) !== 0n
    ) {

        return `

            <div class="transaction">

                <div class="transaction-title">

                    <img
                        src="https://i.ibb.co/678kxQYb/file-00000000e5148246988e64699e30801e.png"
                        class="token-icon"
                        alt="GAS"
                    >

                    GAS перевод

                </div>

                <div class="amount gas">
                    ${formatGas(transaction.value)}
                </div>

                <div class="small">
                    From:
                    ${shortAddress(transaction.from)}
                </div>

                <div class="small">
                    To:
                    ${shortAddress(transaction.to)}
                </div>

                <div class="small">
                    Tx:
                    ${transaction.hash}
                </div>

            </div>

        `;
    }


    /*
        Обычная контрактная транзакция
    */
    return `

        <div class="transaction">

            <div class="transaction-title">
                ⚙️ Транзакция
            </div>

            <div class="small">
                From:
                ${shortAddress(transaction.from)}
            </div>

            <div class="small">
                To:
                ${shortAddress(transaction.to)}
            </div>

            <div class="small">
                Tx:
                ${transaction.hash}
            </div>

        </div>

    `;
}


/*
    Загружаем Explorer из Neon API
*/
async function loadExplorer() {

    const status =
        document.getElementById("status");

    const error =
        document.getElementById("error");

    const blocksContainer =
        document.getElementById("blocks");


    try {

        error.innerHTML = "";

        status.innerText =
            "Подключение к GlebusNet...";


        /*
            Получаем историю из server.js → Neon
        */
        const response =
            await fetch(API);


        if (!response.ok) {

            throw new Error(
                "HTTP ошибка: " +
                response.status
            );

        }


        const data =
            await response.json();


        if (data.error) {

            throw new Error(
                data.error
            );

        }


        /*
            GlebusNet
        */
        document.getElementById(
            "network"
        ).innerText =
            "GlebusNet";


        /*
            Chain ID проекта
        */
        document.getElementById(
            "chainId"
        ).innerText =
            "7777";


        /*
            Последний сохранённый блок
        */
        document.getElementById(
            "blockNumber"
        ).innerText =
            data.latestBlock ?? "—";


        /*
            Очищаем старые блоки
        */
        blocksContainer.innerHTML = "";


        /*
            API уже группирует транзакции по блокам.
        */
        const blocks =
            Array.isArray(data.blocks)
                ? data.blocks
                : [];

        const allTransactions =
            Array.isArray(data.transactions)
                ? data.transactions
                : [];


        /*
            Если истории нет
        */
        if (blocks.length === 0) {

            blocksContainer.innerHTML = `

                <div class="block">

                    <div class="small">
                        Сохранённых блоков пока нет.
                    </div>

                </div>

            `;

            status.innerText =
                "● GlebusNet работает";

            return;
        }


        /*
            Сортируем блоки от новых к старым.
        */
        blocks.sort(
            (a, b) =>
                Number(b.number) -
                Number(a.number)
        );


        /*
            Показываем последние 10 сохранённых блоков.
        */
        const visibleBlocks =
            blocks.slice(0, 10);


        for (const block of blocks) {

            block.transactions =
                allTransactions.filter(
                    tx =>
                        Number(tx.blockNumber) ===
                        Number(block.number)
                );

        }


        for (
            const block
            of visibleBlocks
        ) {

            const number =
                Number(block.number);


            const transactions =
                Array.isArray(block.transactions)
                    ? block.transactions
                    : [];


            let transactionsHTML = "";


            /*
                Транзакции блока
            */
            if (
                transactions.length > 0
            ) {

                for (
                    const transaction
                    of transactions
                ) {

                    transactionsHTML +=
                        renderTransaction(
                            transaction
                        );

                }

            } else {

                transactionsHTML = `

                    <div class="small">
                        Транзакций нет
                    </div>

                `;

            }


            /*
                Создаём блок
            */
            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "block";


            div.innerHTML = `

                <div class="block-number">
                    Block #${number}
                </div>

                <div class="small">
                    Источник: Neon
                </div>

                <div class="small">
                    Транзакций:
                    ${transactions.length}
                </div>

                ${transactionsHTML}

            `;


            blocksContainer.appendChild(
                div
            );

        }


        status.innerText =
            "● GlebusNet работает";

    }


    catch (e) {

        console.error(e);


        status.innerText =
            "Ошибка подключения";


        error.innerHTML = `

            <div class="error">

                Не удалось получить историю
                GlebusNet:<br><br>

                ${e.message}

            </div>

        `;

    }

}


/*
    Первый запуск
*/
loadExplorer();

</script>

</body>

</html>
