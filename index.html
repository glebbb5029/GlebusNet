<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GlebusNet</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111827;
            color: white;

            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 420px;

            padding: 30px;
            box-sizing: border-box;

            text-align: center;

            background: #1f2937;
            border-radius: 24px;
        }

        .logos {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 15px;

            margin-bottom: 20px;
        }

        .logo {
            width: 70px;
            height: 70px;

            border-radius: 16px;

            object-fit: contain;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #9ca3af;
        }

        button {
            width: 100%;

            padding: 16px;
            margin-top: 12px;

            border: none;
            border-radius: 12px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .network {
            background: #6366f1;
            color: white;
        }

        .token {
            background: #22c55e;
            color: white;
        }

        #status {
            margin-top: 20px;

            color: #9ca3af;

            font-size: 14px;

            word-break: break-word;
        }

    </style>

</head>


<body>


<div class="card">


    <div class="logos">

        <img
            class="logo"
            src="https://i.ibb.co/678kxQYb/file-00000000e5148246988e64699e30801e.png"
            alt="GAS"
        >

        <img
            class="logo"
            src="https://i.ibb.co/7d0fTvgN/file-000000004fc482109e9ebee3afecb3fb.png"
            alt="GLB"
        >

    </div>


    <h1>GlebusNet</h1>

    <p>
        Custom EVM blockchain network
    </p>


    <button
        class="network"
        onclick="addNetwork()"
    >
        ⛽ Добавить GlebusNet
    </button>


    <button
        class="token"
        onclick="addToken()"
    >
        🪙 Добавить GLB
    </button>


    <div id="status"></div>


</div>



<script>


const RPC =
    "https://glebusnet.onrender.com";


const CHAIN_ID =
    "0x1E61";


const TOKEN =
    "0x5FbDB2315678afecb367f032d93F642f64180aa3";


const GLB_LOGO =
    "https://i.ibb.co/7d0fTvgN/file-000000004fc482109e9ebee3afecb3fb.png";



async function addNetwork() {

    if (!window.ethereum) {

        document.getElementById("status").innerText =
            "MetaMask не найден. Откройте страницу через MetaMask.";

        return;
    }


    try {

        await window.ethereum.request({

            method: "wallet_addEthereumChain",

            params: [

                {

                    chainId: CHAIN_ID,

                    chainName: "GlebusNet",

                    nativeCurrency: {

                        name: "GAS",

                        symbol: "GAS",

                        decimals: 18

                    },

                    rpcUrls: [

                        RPC

                    ]

                }

            ]

        });


        document.getElementById("status").innerText =
            "GlebusNet добавлен!";


    } catch (error) {

        console.error(error);


        document.getElementById("status").innerText =
            "Ошибка: " +
            (error.message || "не удалось добавить сеть");

    }

}



async function addToken() {

    if (!window.ethereum) {

        document.getElementById("status").innerText =
            "MetaMask не найден. Откройте страницу через MetaMask.";

        return;
    }


    try {


        document.getElementById("status").innerText =
            "Переключаемся на GlebusNet...";


        // Проверяем текущую сеть

        const currentChain =
            await window.ethereum.request({

                method: "eth_chainId"

            });


        // Если это не GlebusNet,
        // переключаемся на неё

        if (currentChain !== CHAIN_ID) {

            try {

                await window.ethereum.request({

                    method: "wallet_switchEthereumChain",

                    params: [

                        {

                            chainId: CHAIN_ID

                        }

                    ]

                });

            } catch (switchError) {

                // 4902 = сеть ещё не добавлена

                if (switchError.code === 4902) {

                    await window.ethereum.request({

                        method: "wallet_addEthereumChain",

                        params: [

                            {

                                chainId: CHAIN_ID,

                                chainName: "GlebusNet",

                                nativeCurrency: {

                                    name: "GAS",

                                    symbol: "GAS",

                                    decimals: 18

                                },

                                rpcUrls: [

                                    RPC

                                ]

                            }

                        ]

                    });

                } else {

                    throw switchError;

                }

            }

        }


        document.getElementById("status").innerText =
            "Добавляем GLB...";


        // Добавляем ERC-20 токен

        const added =
            await window.ethereum.request({

                method: "wallet_watchAsset",

                params: {

                    type: "ERC20",

                    options: {

                        address: TOKEN,

                        symbol: "GLB",

                        decimals: 18,

                        image: GLB_LOGO

                    }

                }

            });


        if (added) {

            document.getElementById("status").innerText =
                "GLB успешно добавлен в MetaMask!";

        } else {

            document.getElementById("status").innerText =
                "Добавление GLB отменено.";

        }


    } catch (error) {

        console.error(error);


        document.getElementById("status").innerText =
            "Ошибка MetaMask: " +
            (error.message || "неизвестная ошибка");

    }

}


</script>


</body>

</html>
